name: android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-test-android:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: android-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-v2

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '11'

    - name: Install NDK version 21.3.6528147
      run: |
        set -euo pipefail
        SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
        export ANDROID_SDK_ROOT="$SDK_ROOT"
        SDKMANAGER=""
        if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        else
          if [ -d "$SDK_ROOT/cmdline-tools" ]; then
            found=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1 || true)
          else
            found=""
          fi
          if [ -n "${found:-}" ] && [ -x "$found" ]; then
            SDKMANAGER="$found"
          fi
        fi
        if [ -z "$SDKMANAGER" ]; then
          echo "Installing Android command-line tools (JDK 11+ compatible sdkmanager; legacy tools/ build is broken on Java 11)."
          TMP=$(mktemp -d)
          curl -fsSL -o "$TMP/cmdline-tools.zip" \
            "https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip"
          unzip -q "$TMP/cmdline-tools.zip" -d "$TMP/clt"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv "$TMP/clt/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        fi
        yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;21.3.6528147"

    - name: Install Rust 1.83.0 toolchain
      uses: actions-rs/toolchain@v1
      with:
          toolchain: 1.83.0
          override: true
          components: rustfmt, clippy

    - name: Install Rust Android targets
      run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

    # Skip the connected checks in the CI script, as they require an emulator setup.
    - name: Run CI script
      run: ./ci-android.sh --skip-connected-check

    - name: Upload Android library and Unity Android plugin
      uses: actions/upload-artifact@v4
      with:
        name: android-build
        path: |
          android-library/
          interfaces/unity/NiceVibrations/Assets/NiceVibrations/Plugins/Android/libs/
