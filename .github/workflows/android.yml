name: android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-test-android:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: android-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-v2

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '8'

    - name: Install NDK version 21.3.6528147
      run: sudo ${ANDROID_HOME}/tools/bin/sdkmanager --install "ndk;21.3.6528147"

    - name: Install Rust 1.60.0 toolchain
      uses: actions-rs/toolchain@v1
      with:
          toolchain: 1.60.0
          override: true
          components: rustfmt, clippy

    - name: Install Rust Android targets
      run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

    # Skip the connected checks in the CI script, as they require an emulator setup.
    - name: Run CI script
      run: ./ci-android.sh --skip-connected-check

    - name: Upload Android library and Unity Android plugin
      uses: actions/upload-artifact@v4
      with:
        name: android-build
        path: |
          android-library/
          interfaces/unity/NiceVibrations/Assets/NiceVibrations/Plugins/Android/libs/
